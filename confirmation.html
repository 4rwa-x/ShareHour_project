<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Share Hour - Booking Confirmation</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 40px; }
        .card { max-width: 450px; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); margin: auto; text-align: center; }
        h2 { color: #2c3e50; margin-bottom: 5px; }
        .subtitle { color: #7f8c8d; font-weight: bold; margin-bottom: 20px; }
        .details { text-align: left; border-top: 1px solid #eee; border-bottom: 1px solid #eee; padding: 15px 0; margin-bottom: 20px; line-height: 1.8; color: #34495e; }
        .total { font-size: 20px; font-weight: bold; color: #27ae60; margin-bottom: 20px; }
        button { background-color: #3498db; color: white; border: none; padding: 12px 20px; font-size: 15px; border-radius: 5px; cursor: pointer; }
        button:hover { background-color: #2980b9; }
        .nav-link { margin-top: 15px; }
        .nav-link a { color: #7f8c8d; font-size: 14px; text-decoration: none; }
        .nav-link a:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="card">
    <h2>Thank You, Ahmed!</h2>
    <div class="subtitle">Your Booking Request Details</div>

    <div class="details">
        <p><strong>Booking ID:</strong> #101</p>
        <p><strong>Tool:</strong> Electric Drill</p>
        <p><strong>Date:</strong> 2026-10-20</p>
        <p><strong>Time Slot:</strong> 10:00 AM - 01:00 PM (3 Hours)</p>
        <p><strong>Status:</strong> <span style="color: #f39c12; font-weight: bold;">PENDING APPROVAL</span></p>
    </div>

    <div class="total">Total Price: 15.0 OMR</div>

   
    <button onclick="window.location.href='renter.html'">Book Another Tool</button>


   
</div>

</body>
</html>
